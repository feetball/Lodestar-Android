name: Release bundle

# Builds the signed release bundle (.aab) of the commit it is run on, for upload by hand in Play Console
# (Test and release > Testing > Closed testing > Create new release). Run it from the Actions tab on a commit
# whose CI is green. The upload key comes from repository secrets and never into the repository:
#   UPLOAD_KEYSTORE_BASE64  the upload keystore, base64 (base64 -w0 upload-key.jks)
#   UPLOAD_STORE_PASSWORD   its store password
#   UPLOAD_KEY_ALIAS        optional, "upload" when empty
#   UPLOAD_KEY_PASSWORD     optional, the store password when empty

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::The secrets UPLOAD_KEYSTORE_BASE64 and UPLOAD_STORE_PASSWORD are not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Signed release bundle
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          args=(-Plodestar.signing.storeFile="$RUNNER_TEMP/upload.jks" -Plodestar.signing.storePassword="$STORE_PASSWORD")
          if [ -n "$KEY_ALIAS" ]; then args+=(-Plodestar.signing.keyAlias="$KEY_ALIAS"); fi
          if [ -n "$KEY_PASSWORD" ]; then args+=(-Plodestar.signing.keyPassword="$KEY_PASSWORD"); fi
          ./gradlew :app:bundleRelease "${args[@]}" --no-configuration-cache --console=plain
      - name: Verify the signature
        run: |
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/verify.txt"
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          {
            echo "### Lodestar $name ($code)"
            echo
            echo "Signed with the upload key whose fingerprint is (compare it with Play Console > App signing > Upload key certificate):"
            echo
            echo '```'
            keytool -printcert -jarfile "$bundle" | grep -E 'Owner|SHA1|SHA256'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lodestar-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
